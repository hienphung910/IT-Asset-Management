<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ITAM · Quản lý tài sản</title>
  <script>
    // Áp giao diện đã chọn trước khi vẽ trang (tránh nháy màu)
    try {
      var t = localStorage.getItem("itam-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/assets" aria-label="ITAM, về trang Tài sản">
        <span class="tape tape-lg">ITAM</span>
      </a>
      <nav class="nav" aria-label="Điều hướng chính" hidden>
        <a href="#/assets" data-nav="assets">Tài sản</a>
        <a href="#/employees" data-nav="employees" data-perm="asset.view_all" hidden>Nhân viên</a>
        <a href="#/locations" data-nav="locations" data-perm="asset.view_all" hidden>Vị trí</a>
        <a href="#/categories" data-nav="categories" data-perm="asset.view_all" hidden>Danh mục</a>
        <a href="#/agents" data-nav="agents" data-perm="asset.view_all" hidden>Agent</a>
        <a href="#/users" data-nav="users" data-perm="user.manage" hidden>Tài khoản<span class="count" id="pending-count" hidden></span></a>
      </nav>
      <details class="usermenu" id="userbox" hidden></details>
    </div>
  </header>
  <main class="main">
    <div id="app" class="container"><p class="muted">Đang tải…</p></div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
